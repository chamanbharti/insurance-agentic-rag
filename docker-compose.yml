services:

  postgres:
    image: pgvector/pgvector:pg17
    container_name: insurance-postgres

    environment:
      POSTGRES_DB: insurance
      POSTGRES_USER: insurance
      POSTGRES_PASSWORD: insurance

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U insurance -d insurance"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
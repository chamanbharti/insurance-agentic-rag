[project]
name = "insurance-agentic-rag"
version = "0.1.0"
description = "Production-style Insurance Agentic RAG using FastAPI, LangGraph, Ollama, Redis and pgvector"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi[standard]>=0.115",
    "langchain-ollama>=1.1.0",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
